<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cohen-Sutherland 2D Interaktif</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #16233b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --acc: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 0%, #1b2f52, #0b1220 42%, #060b16 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 330px;
      gap: 14px;
    }
    .panel {
      background: linear-gradient(180deg, #1b2d4a, var(--panel));
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }
    .title { padding: 12px 14px 0; }
    h2 { margin: 0 0 5px; color: var(--acc); }
    .muted { margin: 0; color: var(--muted); font-size: .9rem; }
    canvas {
      width: 100%;
      display: block;
      border-top: 1px solid #334155;
      border-bottom: 1px solid #334155;
      background: #020617;
      cursor: crosshair;
      touch-action: none;
    }
    .toolbar { padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 8px; padding: 8px 11px; cursor: pointer; font-weight: 700;
      background: var(--acc); color: #082f49;
    }
    button.secondary { background: #334155; color: #e2e8f0; }
    .side { padding: 12px; display: grid; gap: 12px; }
    .card {
      border: 1px solid #334155; border-radius: 10px; padding: 10px;
      background: rgba(2,6,23,.35);
    }
    .card h3 { margin: 0 0 8px; color: #7dd3fc; font-size: .95rem; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    input[type="number"] {
      width: 100%; padding: 7px; border-radius: 8px;
      border: 1px solid #334155; background: #0b1220; color: #e2e8f0;
    }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: 6px 0; border-bottom: 1px solid #2a3b57; }
    .badge { border-radius: 5px; padding: 2px 6px; font-size: .75rem; font-weight: 700; }
    .inside { background: #064e3b; color: var(--ok); }
    .partial { background: #78350f; color: var(--warn); }
    .outside { background: #7f1d1d; color: var(--bad); }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <div class="panel">
      <div class="title">
        <h2>Cohen-Sutherland 2D</h2>
        <p class="muted">Drag titik ujung garis untuk melihat status clipping berubah real-time.</p>
      </div>
      <canvas id="canvas" width="860" height="580"></canvas>
      <div class="toolbar">
        <button id="resetBtn">Reset Garis</button>
        <button id="toggleBtn" class="secondary">Sembunyikan Garis Asli</button>
      </div>
    </div>

    <div class="panel side">
      <div class="card">
        <h3>Window Clipping</h3>
        <div class="grid2">
          <div><label>xMin</label><input id="xmin" type="number" step="0.1" value="-0.4" /></div>
          <div><label>xMax</label><input id="xmax" type="number" step="0.1" value="0.4" /></div>
          <div><label>yMin</label><input id="ymin" type="number" step="0.1" value="-0.4" /></div>
          <div><label>yMax</label><input id="ymax" type="number" step="0.1" value="0.4" /></div>
        </div>
      </div>

      <div class="card">
        <h3>Status Clipping</h3>
        <table>
          <thead><tr><th>Garis</th><th>Status</th></tr></thead>
          <tbody id="statusBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h3>Keterangan</h3>
        <p class="muted" style="line-height:1.4;">Bagian garis hasil clipping digambar lebih tebal. Garis asli digambar tipis (opsional).</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusBody = document.getElementById("statusBody");
    const inputs = {
      xmin: document.getElementById("xmin"), xmax: document.getElementById("xmax"),
      ymin: document.getElementById("ymin"), ymax: document.getElementById("ymax")
    };

    const colors = ["#ff6666", "#66ff66", "#66ccff", "#ffff66"];
    const names = ["A-B", "C-D", "E-F", "G-H"];
    let showOriginal = true;
    let dragging = null;

    const seed = () => [
      { a: { x: -0.3, y: 0.1 }, b: { x: 0.2, y: 0.2 } },
      { a: { x: 0.5, y: 0.0 }, b: { x: 0.7, y: 0.3 } },
      { a: { x: 0.0, y: 0.0 }, b: { x: 0.5, y: 0.3 } },
      { a: { x: -0.6, y: 0.1 }, b: { x: 0.1, y: 0.5 } }
    ];
    let lines = seed();

    function clamp(v) { return Math.max(-1, Math.min(1, v)); }

    function toCanvas(p) {
      return {
        x: ((p.x + 1) / 2) * canvas.width,
        y: ((1 - (p.y + 1) / 2)) * canvas.height
      };
    }

    function toWorld(x, y) {
      return {
        x: clamp((x / canvas.width) * 2 - 1),
        y: clamp((1 - y / canvas.height) * 2 - 1)
      };
    }

    const INSIDE = 0, LEFT = 1, RIGHT = 2, BOTTOM = 4, TOP = 8;

    function outCode(p, w) {
      let code = INSIDE;
      if (p.x < w.xmin) code |= LEFT;
      else if (p.x > w.xmax) code |= RIGHT;
      if (p.y < w.ymin) code |= BOTTOM;
      else if (p.y > w.ymax) code |= TOP;
      return code;
    }

    function clipLine(a, b, w) {
      let p1 = { ...a }, p2 = { ...b };
      let c1 = outCode(p1, w), c2 = outCode(p2, w);
      let accept = false;

      while (true) {
        if (!(c1 | c2)) { accept = true; break; }
        if (c1 & c2) { break; }

        let cOut = c1 ? c1 : c2;
        let x = 0, y = 0;

        if (cOut & TOP) {
          x = p1.x + (p2.x - p1.x) * (w.ymax - p1.y) / (p2.y - p1.y);
          y = w.ymax;
        } else if (cOut & BOTTOM) {
          x = p1.x + (p2.x - p1.x) * (w.ymin - p1.y) / (p2.y - p1.y);
          y = w.ymin;
        } else if (cOut & RIGHT) {
          y = p1.y + (p2.y - p1.y) * (w.xmax - p1.x) / (p2.x - p1.x);
          x = w.xmax;
        } else if (cOut & LEFT) {
          y = p1.y + (p2.y - p1.y) * (w.xmin - p1.x) / (p2.x - p1.x);
          x = w.xmin;
        }

        if (cOut === c1) {
          p1 = { x, y };
          c1 = outCode(p1, w);
        } else {
          p2 = { x, y };
          c2 = outCode(p2, w);
        }
      }

      let status = "Trivial Reject";
      if (accept) {
        const same = Math.abs(p1.x - a.x) < 1e-6 && Math.abs(p1.y - a.y) < 1e-6 && Math.abs(p2.x - b.x) < 1e-6 && Math.abs(p2.y - b.y) < 1e-6;
        status = same ? "Trivial Accept" : "Partial Clipping";
      }

      return { accept, p1, p2, status };
    }

    function statusClass(status) {
      if (status === "Trivial Accept") return "inside";
      if (status === "Partial Clipping") return "partial";
      return "outside";
    }

    function nearestHandle(mx, my) {
      for (let i = 0; i < lines.length; i++) {
        const a = toCanvas(lines[i].a);
        const b = toCanvas(lines[i].b);
        if (Math.hypot(mx - a.x, my - a.y) < 12) return { idx: i, end: "a" };
        if (Math.hypot(mx - b.x, my - b.y) < 12) return { idx: i, end: "b" };
      }
      return null;
    }

    function draw() {
      const w = {
        xmin: Number(inputs.xmin.value), xmax: Number(inputs.xmax.value),
        ymin: Number(inputs.ymin.value), ymax: Number(inputs.ymax.value)
      };
      if (w.xmin >= w.xmax) w.xmax = w.xmin + 0.1;
      if (w.ymin >= w.ymax) w.ymax = w.ymin + 0.1;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#1f2937";
      for (let i = 0; i <= 10; i++) {
        const x = (i / 10) * canvas.width;
        const y = (i / 10) * canvas.height;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      const min = toCanvas({ x: w.xmin, y: w.ymin });
      const max = toCanvas({ x: w.xmax, y: w.ymax });
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.strokeRect(min.x, max.y, max.x - min.x, min.y - max.y);

      const rows = [];
      lines.forEach((line, i) => {
        const clipped = clipLine(line.a, line.b, w);
        const pa = toCanvas(line.a);
        const pb = toCanvas(line.b);

        if (showOriginal) {
          ctx.strokeStyle = colors[i] + "88";
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        }

        if (clipped.accept) {
          const c1 = toCanvas(clipped.p1);
          const c2 = toCanvas(clipped.p2);
          ctx.strokeStyle = colors[i];
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y); ctx.stroke();
        }

        ["a", "b"].forEach((end) => {
          const p = toCanvas(line[end]);
          ctx.beginPath();
          ctx.fillStyle = colors[i];
          ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 2;
          ctx.stroke();
        });

        rows.push(`<tr><td style="color:${colors[i]};font-weight:700;">${names[i]}</td><td><span class="badge ${statusClass(clipped.status)}">${clipped.status}</span></td></tr>`);
      });

      statusBody.innerHTML = rows.join("");
    }

    canvas.addEventListener("pointerdown", (e) => {
      const r = canvas.getBoundingClientRect();
      dragging = nearestHandle(e.clientX - r.left, e.clientY - r.top);
      if (dragging) canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const r = canvas.getBoundingClientRect();
      lines[dragging.idx][dragging.end] = toWorld(e.clientX - r.left, e.clientY - r.top);
      draw();
    });

    canvas.addEventListener("pointerup", () => dragging = null);
    canvas.addEventListener("pointerleave", () => dragging = null);

    Object.values(inputs).forEach((inp) => inp.addEventListener("input", draw));

    document.getElementById("resetBtn").addEventListener("click", () => {
      lines = seed();
      draw();
    });

    document.getElementById("toggleBtn").addEventListener("click", () => {
      showOriginal = !showOriginal;
      document.getElementById("toggleBtn").textContent = showOriginal ? "Sembunyikan Garis Asli" : "Tampilkan Garis Asli";
      draw();
    });

    draw();
  </script>
</body>
</html>
